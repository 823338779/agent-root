# 通过 Docker DNS 跟踪三个副本地址，重建单个副本后继续转发查询。
upstream dbt_workers {
    zone dbt_workers 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server dbt-service:8000 resolve;
}

server {
    listen 8000;
    location / {
        proxy_pass http://dbt_workers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 1900s;
    }
}
