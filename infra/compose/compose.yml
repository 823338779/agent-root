# 沿用现有容器的 Compose 项目名，使本文件能够识别本机已运行的服务。
name: data-agent

services:
  # 登记已有 StarRocks 服务，复用现有元数据和存储卷。
  # 本机访问账号：root；默认密码：空（无需密码）。
  starrocks:
    image: starrocks/allin1-ubuntu:3.5.19
    container_name: data-agent-starrocks
    restart: unless-stopped
    ports:
      # 仅供本机访问：FE HTTP、BE HTTP、MySQL 协议。
      - "127.0.0.1:8030:8030"
      - "127.0.0.1:8040:8040"
      - "127.0.0.1:9030:9030"
    volumes:
      - starrocks-fe-meta:/data/deploy/starrocks/fe/meta
      - starrocks-be-storage:/data/deploy/starrocks/be/storage
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 9030 -u root -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 30

  # 所有 Agent 会话共享的 Forgejo；Web 与 SSH 仅向本机开放。
  # Web 管理员账号：agent-admin；密码：admin。由 Initialize-GitService.ps1 初始化时输入，不写入 Compose。
  # SSH Git 账号：git；认证方式：初始化脚本生成的专用 SSH Key，无密码登录。
  git:
    image: codeberg.org/forgejo/forgejo:15.0.9-rootless
    container_name: forgejo
    environment:
      # 使用内置 SQLite，保持本地 Git 服务与产品 PostgreSQL 相互独立。
      FORGEJO__database__DB_TYPE: sqlite3
      # Web 与克隆地址固定指向本机，避免生成不可访问的容器内部地址。
      FORGEJO__server__DOMAIN: 127.0.0.1
      FORGEJO__server__ROOT_URL: http://127.0.0.1:3000/
      FORGEJO__server__SSH_DOMAIN: 127.0.0.1
      FORGEJO__server__SSH_PORT: ${GIT_SSH_PORT:-2222}
      FORGEJO__server__SSH_LISTEN_PORT: 2222
      FORGEJO__server__START_SSH_SERVER: "true"
      # 本地实例由初始化脚本管理账户和私有仓库，不开放自助注册与安装页面。
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__repository__FORCE_PRIVATE: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:${GIT_SSH_PORT:-2222}:2222"
    volumes:
      - forgejo-data:/var/lib/gitea
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 24
    restart: unless-stopped

  # PostgreSQL 账号：data_agent；密码：${POSTGRES_PASSWORD:-data_agent_local_dev}。
  # 可访问数据库：data_agent、data_agent_v2、metric_platform。
  postgres:
    image: postgres:16.9-alpine
    container_name: data-agent-postgres
    environment:
      POSTGRES_DB: data_agent
      POSTGRES_USER: data_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_agent_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_agent -d data_agent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  metric-platform-db-init:
    image: postgres:16.9-alpine
    container_name: metric-platform-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-data_agent_local_dev}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        psql -h postgres -U data_agent -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname='metric_platform'" | grep -q 1 ||
        createdb -h postgres -U data_agent -O data_agent metric_platform
    restart: "no"

  data-agent-v2-db-init:
    image: postgres:16.9-alpine
    container_name: data-agent-v2-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-data_agent_local_dev}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        psql -h postgres -U data_agent -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname='data_agent_v2'" | grep -q 1 ||
        createdb -h postgres -U data_agent -O data_agent data_agent_v2
    restart: "no"

  # 为 V3 创建独立业务库，兼容已有 PostgreSQL 数据卷。
  data-agent-v3-db-init:
    image: postgres:16.9-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-data_agent_local_dev}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        exists=$$(psql -h postgres -U data_agent -d postgres -Atc "SELECT 1 FROM pg_database WHERE datname='data_agent_v3'")
        if [ "$$exists" != "1" ]; then
          createdb -h postgres -U data_agent -O data_agent data_agent_v3
        fi
    restart: "no"

  # Redis ACL 账号：default；密码：${REDIS_PASSWORD:-redis_local_dev}。
  redis:
    image: redis:7.4-alpine
    container_name: data-agent-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_dev}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Metric Platform Web 登录账号：admin；密码：${METRIC_PLATFORM_ADMIN_PASSWORD:-admin}。
  # 其 PostgreSQL 与 Redis 凭据复用上方中间件账号。
  metric-platform-api:
    profiles: [full]
    build:
      context: ../..
      dockerfile: infra/docker/metric-platform-api.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: swarm
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/metric_platform
      SPRING_DATASOURCE_USERNAME: data_agent
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-data_agent_local_dev}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_USERNAME: default
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_dev}
      METRIC_PLATFORM_IDENTITY_AUTH_BOOTSTRAP_PASSWORD: ${METRIC_PLATFORM_ADMIN_PASSWORD:-admin}
      DBT_SERVICE_BASE_URI: ${DBT_SERVICE_BASE_URI:-http://host.docker.internal:8000}
      DBT_SERVICE_TOKEN: ${DBT_SERVICE_TOKEN:-}
    depends_on:
      metric-platform-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8090/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # Data Agent V2当前使用固定本地身份，不启用旧版账号与调度配置。
  data-agent-api:
    profiles: [full]
    build:
      context: ../..
      dockerfile: infra/docker/data-agent-api.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/data_agent_v2
      SPRING_DATASOURCE_USERNAME: data_agent
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-data_agent_local_dev}
      DATA_AGENT_MODEL_PROVIDER: ollama
      SPRING_AI_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      data-agent-v2-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  metric-platform-web:
    profiles: [full]
    build:
      context: ../..
      dockerfile: infra/docker/metric-platform-web.Dockerfile
    depends_on:
      metric-platform-api:
        condition: service_healthy
    ports:
      - "${METRIC_PLATFORM_PORT:-8090}:80"
    restart: unless-stopped

  data-agent-web:
    profiles: [full]
    build:
      context: ../..
      dockerfile: infra/docker/data-agent-web.Dockerfile
    depends_on:
      data-agent-api:
        condition: service_healthy
    ports:
      - "${DATA_AGENT_PORT:-8080}:80"
    restart: unless-stopped

# 显式复用现有网络；外部资源不会随 docker compose down -v 删除。
networks:
  default:
    external: true
    name: data-agent_default

volumes:
  # 复用已有 StarRocks 数据卷，不创建新的空卷，也不重跑旧项目的数据初始化。
  # 外部数据卷不会随 docker compose down -v 删除。
  starrocks-fe-meta:
    external: true
    name: data-agent_starrocks-fe-meta
  starrocks-be-storage:
    external: true
    name: data-agent_starrocks-be-storage
  # 由 Initialize-GitService.ps1 创建，生命周期独立于 Compose down --volumes。
  forgejo-data:
    name: agent-platform_forgejo-data
    external: true
  postgres-data:
  redis-data:
