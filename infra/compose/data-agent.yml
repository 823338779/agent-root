name: data-agent

services:
  postgres:
    image: postgres:16.9-alpine
    container_name: data-agent-postgres
    environment:
      POSTGRES_DB: data_agent
      POSTGRES_USER: data_agent
      POSTGRES_PASSWORD: data_agent_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_agent -d data_agent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  metric-platform-db-init:
    image: postgres:16.9-alpine
    container_name: metric-platform-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: data_agent_local_dev
    entrypoint:
      - /bin/sh
      - -c
      - >-
        psql -h postgres -U data_agent -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname='metric_platform'" | grep -q 1 ||
        createdb -h postgres -U data_agent -O data_agent metric_platform
    restart: "no"

  redis:
    image: redis:7.4-alpine
    container_name: data-agent-redis
    environment:
      REDIS_PASSWORD: redis_local_dev
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
