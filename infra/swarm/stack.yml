version: "3.9"

# No domain is required: publish the two frontend services on different ports and use a node LAN IP.
# Docker stack does not build images. Build and push the four LOCAL_REGISTRY images before deployment.
services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: data_agent
      POSTGRES_USER: data_agent
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [platform-backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_agent -d data_agent"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.data-agent.stateful == true
      restart_policy:
        condition: any

  metric-platform-db-init:
    image: postgres:16.9-alpine
    environment:
      PGHOST: postgres
      PGUSER: data_agent
    secrets:
      - postgres-password
    networks: [platform-backend]
    command:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres-password)"
        until pg_isready -d postgres; do sleep 2; done
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='metric_platform'" | grep -q 1 || createdb -O data_agent metric_platform
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  redis:
    image: redis:7.4-alpine
    secrets:
      - redis-password
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis-password)"
    volumes:
      - redis-data:/data
    networks: [platform-backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis-password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.data-agent.stateful == true
      restart_policy:
        condition: any

  data-agent-api:
    image: ${LOCAL_REGISTRY}/data-agent-api:${IMAGE_TAG}
    environment:
      SPRING_PROFILES_ACTIVE: swarm
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/run/secrets/application-secrets.yml
      DATA_AGENT_SCHEDULER_NODE_ID: "{{.Task.ID}}"
      DATA_AGENT_SCHEDULER_INSTANCE_ADDRESS: "{{.Task.Name}}"
      DATA_AGENT_CLUSTER_EVENTS_NODE_ID: "{{.Task.ID}}"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    secrets:
      - source: data-agent-application
        target: application-secrets.yml
    networks: [platform-backend]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    deploy:
      replicas: 3
      placement:
        preferences:
          - spread: node.id
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure

  metric-platform-api:
    image: ${LOCAL_REGISTRY}/metric-platform-api:${IMAGE_TAG}
    environment:
      SPRING_PROFILES_ACTIVE: swarm
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/run/secrets/application-secrets.yml
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    secrets:
      - source: metric-platform-application
        target: application-secrets.yml
    networks: [platform-backend]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8090/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.id
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure

  data-agent-web:
    image: ${LOCAL_REGISTRY}/data-agent-web:${IMAGE_TAG}
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress
    networks: [platform-backend]
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.id
      restart_policy:
        condition: on-failure

  metric-platform-web:
    image: ${LOCAL_REGISTRY}/metric-platform-web:${IMAGE_TAG}
    ports:
      - target: 80
        published: 8090
        protocol: tcp
        mode: ingress
    networks: [platform-backend]
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.id
      restart_policy:
        condition: on-failure

networks:
  platform-backend:
    driver: overlay
    attachable: false

volumes:
  postgres-data:
  redis-data:

secrets:
  postgres-password:
    external: true
  redis-password:
    external: true
  data-agent-application:
    external: true
  metric-platform-application:
    external: true
